<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- seo -->
    <!-- Sunucu fonksiyonu (api/page.js) bu bölümü her adres için başlık, açıklama ve yapılandırılmış veriyle doldurur -->
    <title>Bilgi Yarışması · Miraç Deprem</title>
    <meta name="robots" content="noindex" />
    <!-- /seo -->
    <meta name="theme-color" content="#0b0f15" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/src/theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script defer src="https://nabiz.miracdeprem.com/js/nabiz.js" data-site="quiz.miracdeprem.com"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://www.miracdeprem.com" aria-label="miracdeprem.com">
        <span class="brand-logo">md</span>
        <span class="brand-path">~/quiz</span>
      </a>
      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-button" id="theme-toggle" data-i18n-aria="toggleTheme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page">
      <!-- Tur ayarı -->
      <section class="screen" id="setup-screen">
        <div class="intro">
          <h1 data-i18n="title">Bilgi Yarışması</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>

        <section class="card daily" aria-labelledby="daily-title">
          <div class="daily-head">
            <h2 class="daily-title" id="daily-title" data-i18n="dailyTitle"></h2>
            <span class="daily-date" id="daily-date"></span>
          </div>
          <p class="daily-text" id="daily-text"></p>
          <div class="daily-actions">
            <button type="button" class="btn btn-primary" id="daily-start" data-i18n="dailyStart"></button>
            <button type="button" class="btn btn-secondary" id="daily-share" data-i18n="share" hidden></button>
          </div>
          <p class="notice" id="daily-share-status" role="status"></p>
          <p class="streak-line"><span id="streak"></span> <span class="best-streak" id="best-streak"></span></p>
        </section>

        <form class="card setup" id="setup-form">
          <div class="field">
            <span class="field-label" id="area-label" data-i18n="area"></span>
            <div class="segmented" role="radiogroup" aria-labelledby="area-label" id="area-group"></div>
          </div>
          <div class="field">
            <span class="field-label" id="topic-label" data-i18n="topic"></span>
            <div class="topic-grid" role="radiogroup" aria-labelledby="topic-label" id="topic-group"></div>
          </div>
          <div class="field">
            <span class="field-label" id="difficulty-label" data-i18n="difficulty"></span>
            <div class="segmented" role="radiogroup" aria-labelledby="difficulty-label" aria-describedby="difficulty-hint" id="difficulty-group"></div>
            <p class="difficulty-hint" id="difficulty-hint"></p>
          </div>
          <button type="submit" class="btn btn-primary btn-wide" id="start" data-i18n="start"></button>
          <p class="notice" id="setup-status" role="status"></p>
          <p class="best-score" id="best-score"></p>
        </form>

        <section class="card together" aria-labelledby="together-title">
          <h2 class="together-title" id="together-title" data-i18n="togetherTitle"></h2>
          <p class="together-text" data-i18n="togetherIntro"></p>
          <div class="together-actions">
            <a class="btn btn-primary" href="/oda" data-room-mode="create" data-i18n="togetherCreate"></a>
            <a class="btn btn-secondary" href="/oda" data-room-mode="join" data-i18n="togetherJoin"></a>
          </div>
        </section>

        <section class="card progress" aria-labelledby="progress-title">
          <h2 class="progress-title" id="progress-title" data-i18n="progressTitle"></h2>
          <dl class="stats">
            <div><dt data-i18n="statRounds"></dt><dd id="stat-rounds">0</dd></div>
            <div><dt data-i18n="statCorrect"></dt><dd id="stat-correct">0</dd></div>
            <div><dt data-i18n="statAccuracy"></dt><dd id="stat-accuracy">–</dd></div>
          </dl>
          <div class="review-box">
            <button type="button" class="btn btn-secondary" id="review-start"></button>
            <p class="notice" id="review-status" role="status"></p>
          </div>
          <h3 class="badges-title" data-i18n="badges"></h3>
          <ul class="badges" id="badges"></ul>
        </section>
      </section>

      <!-- Birlikte oynama: oda kur / katıl -->
      <section class="screen" id="room-entry-screen" hidden>
        <div class="card room-entry">
          <div class="room-entry-head">
            <h1 class="room-entry-title" data-i18n="togetherTitle"></h1>
            <a class="btn btn-ghost" href="/" id="room-entry-back" data-i18n="backHome"></a>
          </div>
          <div class="segmented" role="tablist" id="room-tabs">
            <button type="button" class="segment" role="tab" id="room-tab-create" aria-controls="room-create" data-tab="create" data-i18n="togetherCreate"></button>
            <button type="button" class="segment" role="tab" id="room-tab-join" aria-controls="room-join" data-tab="join" data-i18n="togetherJoin"></button>
          </div>

          <form class="room-form" id="room-create" role="tabpanel" aria-labelledby="room-tab-create" novalidate>
            <label class="toggle">
              <input type="checkbox" id="room-host-plays" checked />
              <span data-i18n="roomHostPlays"></span>
            </label>
            <div class="field" id="room-host-name-field">
              <label class="field-label" for="room-host-name" data-i18n="roomName"></label>
              <input class="text-input" id="room-host-name" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="done" />
            </div>
            <div class="field">
              <label class="field-label" for="room-topic" data-i18n="topic"></label>
              <select class="text-input" id="room-topic"></select>
            </div>
            <div class="field">
              <span class="field-label" id="room-difficulty-label" data-i18n="difficulty"></span>
              <div class="segmented" role="radiogroup" aria-labelledby="room-difficulty-label" data-setting="difficulty"></div>
            </div>
            <div class="field">
              <span class="field-label" id="room-count-label" data-i18n="roomCount"></span>
              <div class="segmented" role="radiogroup" aria-labelledby="room-count-label" data-setting="count"></div>
            </div>
            <div class="field">
              <span class="field-label" id="room-seconds-label" data-i18n="roomSeconds"></span>
              <div class="segmented" role="radiogroup" aria-labelledby="room-seconds-label" data-setting="seconds"></div>
            </div>
            <div class="field">
              <span class="field-label" id="room-advance-label" data-i18n="roomAdvance"></span>
              <div class="segmented" role="radiogroup" aria-labelledby="room-advance-label" data-setting="advance"></div>
              <p class="field-hint" id="room-advance-hint"></p>
            </div>
            <details class="room-more">
              <summary data-i18n="roomMore"></summary>
              <label class="toggle"><input type="checkbox" data-toggle="questionOnPhones" /><span data-i18n="roomQuestionOnPhones"></span></label>
              <p class="field-hint" data-i18n="roomQuestionOnPhonesHint"></p>
              <label class="toggle"><input type="checkbox" data-toggle="revealOnPhones" /><span data-i18n="roomRevealOnPhones"></span></label>
              <label class="toggle"><input type="checkbox" data-toggle="leaderboardEach" /><span data-i18n="roomLeaderboardEach"></span></label>
              <label class="toggle"><input type="checkbox" data-toggle="speedBonus" /><span data-i18n="roomSpeedBonus"></span></label>
              <label class="toggle"><input type="checkbox" data-toggle="lateJoin" /><span data-i18n="roomLateJoin"></span></label>
            </details>
            <button type="submit" class="btn btn-primary btn-wide" id="room-create-submit" data-i18n="roomCreateSubmit"></button>
            <p class="notice" id="room-create-status" role="status"></p>
          </form>

          <form class="room-form" id="room-join" role="tabpanel" aria-labelledby="room-tab-join" novalidate hidden>
            <div class="field">
              <label class="field-label" for="room-code" data-i18n="roomCode"></label>
              <input class="text-input code-input" id="room-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" />
            </div>
            <div class="field">
              <label class="field-label" for="room-join-name" data-i18n="roomName"></label>
              <input class="text-input" id="room-join-name" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="go" />
            </div>
            <button type="submit" class="btn btn-primary btn-wide" id="room-join-submit" data-i18n="roomJoinSubmit"></button>
            <p class="notice" id="room-join-status" role="status"></p>
          </form>
        </div>
      </section>

      <!-- Birlikte oynama: oda (lobi, soru, sonuç, sıralama, final); içerik room.js'te kurulur -->
      <section class="screen" id="room-screen" hidden>
        <div class="card room" id="room-view" aria-live="polite"></div>
        <p class="notice room-connection" id="room-connection" role="status"></p>
      </section>

      <!-- Soru -->
      <section class="screen" id="round-screen" hidden>
        <div class="card round">
          <div class="round-bar">
            <span class="round-count" id="round-count"></span>
            <span class="round-score"><span data-i18n="score"></span> <strong id="round-score">0</strong></span>
          </div>
          <div class="timer" id="timer" aria-hidden="true"><span class="timer-fill"></span></div>
          <p class="sr-only" id="timer-announce" aria-live="polite"></p>

          <p class="ai-badge" id="ai-badge" data-i18n="aiBadge" hidden></p>
          <h2 class="prompt" id="prompt" tabindex="-1"></h2>
          <img class="question-image" id="question-image" alt="" hidden />
          <pre class="code" id="code" hidden><code id="code-text"></code></pre>

          <div class="options" id="options"></div>
          <ol class="order" id="order" hidden></ol>

          <div class="feedback" id="feedback" role="status"></div>

          <div class="round-actions">
            <div class="jokers">
              <button type="button" class="btn btn-secondary" id="joker-fifty" data-i18n="fifty"></button>
              <button type="button" class="btn btn-secondary" id="joker-time" data-i18n="extraTime"></button>
            </div>
            <button type="button" class="btn btn-primary" id="confirm-order" data-i18n="confirm" hidden></button>
            <button type="button" class="btn btn-primary" id="next" hidden></button>
          </div>
        </div>
      </section>

      <!-- Sonuç -->
      <section class="screen" id="result-screen" hidden>
        <div class="card result">
          <h2 class="result-title" id="result-title"></h2>
          <p class="result-score" id="result-score"></p>
          <p class="result-correct" id="result-correct"></p>
          <p class="result-grid" id="result-grid" aria-hidden="true"></p>
          <div class="result-actions">
            <button type="button" class="btn btn-primary" id="play-again" data-i18n="playAgain"></button>
            <button type="button" class="btn btn-secondary" id="share-result" data-i18n="share"></button>
            <button type="button" class="btn btn-ghost" id="change-topic" data-i18n="changeTopic"></button>
          </div>
          <p class="notice" id="result-share-status" role="status"></p>
          <p class="new-badges" id="new-badges"></p>
        </div>
        <h3 class="review-title" data-i18n="review"></h3>
        <ol class="review" id="review"></ol>
      </section>
    </main>

    <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-title">
      <h2 class="share-title" id="share-title" data-i18n="shareTitle"></h2>
      <label class="sr-only" for="share-text" data-i18n="shareText"></label>
      <textarea class="share-text" id="share-text" rows="4" readonly></textarea>
      <div class="share-targets" id="share-targets"></div>
      <p class="notice" id="share-status" role="status"></p>
      <div class="share-actions">
        <button type="button" class="btn btn-secondary" id="share-native" data-i18n="shareMore" hidden></button>
        <button type="button" class="btn btn-secondary" id="share-copy" data-i18n="copy"></button>
        <button type="button" class="btn btn-ghost" id="share-close" data-i18n="close"></button>
      </div>
    </dialog>

    <dialog class="fb-dialog" id="fb-dialog" aria-labelledby="fb-title">
      <form class="fb-form" id="fb-form" novalidate>
        <h2 class="fb-title" id="fb-title" data-i18n="feedbackTitle"></h2>
        <p class="fb-intro" data-i18n="feedbackIntro"></p>
        <label class="fb-label" for="fb-name" data-i18n="feedbackName"></label>
        <input class="fb-input" id="fb-name" type="text" maxlength="100" autocomplete="name" />
        <label class="fb-label" for="fb-contact" data-i18n="feedbackContact"></label>
        <input class="fb-input" id="fb-contact" type="text" maxlength="255" autocomplete="email" required />
        <label class="fb-label" for="fb-message" data-i18n="feedbackMessage"></label>
        <textarea class="fb-input" id="fb-message" rows="4" maxlength="2000" required></textarea>
        <div class="fb-hp" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input id="fb-website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="fb-status" id="fb-status" role="status"></p>
        <div class="fb-actions">
          <button type="button" class="btn btn-ghost" id="fb-close" data-i18n="feedbackClose"></button>
          <button type="submit" class="btn btn-primary" id="fb-submit" data-i18n="feedbackSend"></button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <button type="button" class="fb-open" id="fb-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="feedback"></span>
      </button>
      <nav class="footer-projects" data-i18n-aria="jsProjects">
        <a href="https://www.miracdeprem.com/projects" data-i18n="otherProjects"></a>
      </nav>
      <div class="footer-meta">
        <span>© 2026 Miraç Deprem</span>
        <a href="https://www.miracdeprem.com" data-i18n="portfolio"></a>
        <a href="https://github.com/MrcDprm/quiz-app" data-i18n="source"></a>
      </div>
    </footer>

    <noscript><p class="noscript">Bu uygulama JavaScript gerektirir. · This app requires JavaScript.</p></noscript>
  </body>
</html>
